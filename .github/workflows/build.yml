# Move this file to .github/workflows/build.yml
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: light-control-linux-x86_64
            bin: light-control
          - os: macos-latest
            artifact: light-control-macos-arm64
            bin: light-control
          - os: windows-latest
            artifact: light-control-windows-x86_64
            bin: light-control.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev libxkbcommon-dev
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/${{ matrix.bin }}
            packaging/linux/99-light-control.rules
