name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: light-control-linux-x86_64
            bin: light-control
          - os: macos-latest
            artifact: light-control-macos-arm64
            bin: light-control
          - os: windows-latest
            artifact: light-control-windows-x86_64
            bin: light-control.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libudev-dev libxkbcommon-dev \
            clang libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/${{ matrix.bin }}
            packaging/linux/99-light-control.rules
