name: release

# Push a tag like `v0.2.0` to build all three OSes and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            bin: light-control
          - os: macos-latest
            target: macos-arm64
            bin: light-control
          - os: windows-latest
            target: windows-x86_64
            bin: light-control.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev libudev-dev libxkbcommon-dev \
            clang libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo test --release
      - run: cargo build --release
      - name: Check Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Only libraries that a stock Ubuntu desktop ships may be linked directly.
          allowed='^(libc|libm|libgcc_s|libudev|libxcb|libglib-2\.0|libgobject-2\.0|libgio-2\.0|libgdk-3|libgtk-3|libgdk_pixbuf-2\.0|libcairo)\.so'
          needed=$(readelf -d target/release/light-control | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          echo "$needed"
          bad=$(echo "$needed" | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "::error::unexpected runtime libraries: $bad"; exit 1; fi
      - name: Package
        shell: bash
        run: |
          name="light-control-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.bin }}" README.md LICENSE "dist/$name/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp packaging/linux/70-light-control.rules "dist/$name/"
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/linux/70-light-control.rules dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "light-control $GITHUB_REF_NAME" \
            --generate-notes
