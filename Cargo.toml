[package]
name = "light-control"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Small open-source controller for the DX-Light / Robobloq USB monitor light strip"
license = "GPL-3.0-only"

[dependencies]
hidapi = "2.6"
tray-icon = "0.21"
tao = "0.34"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"

# Native, GPU-scaled screen capture on macOS (falls back to xcap if unavailable).
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
