[package]
name = "light-control"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "Small open-source controller for the DX-Light / Robobloq USB monitor light strip"
license = "GPL-3.0-only"
repository = "https://github.com/tanmaster/light-control-rs"
homepage = "https://github.com/tanmaster/light-control-rs"
readme = "README.md"
keywords = ["led", "ambilight", "backlight", "hid", "tray"]
categories = ["hardware-support", "command-line-utilities", "multimedia"]

[dependencies]
hidapi = "2.6"
# No libxdo: it is only used for Copy/Paste menu items, and Ubuntu does not ship it by default.
tray-icon = { version = "0.21", default-features = false }
tao = "0.34"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"

# Native, GPU-scaled screen capture on macOS (falls back to xcap if unavailable).
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
